# Escucha las peticiones HTTP entrantes en el puerto interno 80
server {
    listen 80;
    
    # Nombre del servidor (vacío o _ para cualquier nombre de dominio)
    server_name _;
    
    # Directorio raíz donde reside la aplicación dentro del contenedor
    root /var/www/html;
    
    # Archivos por defecto a buscar al acceder a un directorio
    index index.php;
    
    # Permite la subida de archivos hasta un tamaño máximo de 64MB
    client_max_body_size 64M;
    
    # Regla para manejar las URLs amigables de WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Procesa las peticiones PHP mediante FastCGI redirigiéndolas al servicio wordpress
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
